<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1264E8" />
    <title>Purslyx · SDD 最小演示</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #1264e8;
        --brand-soft: #eaf5ff;
        --opportunity: #ffd438;
        --opportunity-soft: #fff7cd;
        --success: #39cea0;
        --success-soft: #def8ea;
        --attention: #ff8a3d;
        --attention-soft: #fff0e6;
        --ink: #18364b;
        --muted: #637b8d;
        --line: #d9e8ef;
        --surface: #ffffff;
        --canvas: #f4f8fb;
        --shadow: 0 14px 40px rgba(25, 75, 112, 0.08);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; color: var(--ink); background: var(--canvas); }
      button, input, textarea, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { cursor: pointer; }
      button:disabled { cursor: wait; opacity: 0.58; }
      a { color: inherit; }
      h1, h2, h3, h4, p { margin: 0; }
      h1 { letter-spacing: -0.035em; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 70px;
        padding: 12px 28px;
        background: rgba(255, 255, 255, 0.94);
        border-bottom: 1px solid rgba(217, 232, 239, 0.88);
        backdrop-filter: blur(14px);
      }
      .brand-button { display: inline-flex; align-items: center; gap: 10px; padding: 0; border: 0; background: transparent; color: var(--ink); font-weight: 800; font-size: 18px; }
      .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; color: #fff; background: var(--brand); box-shadow: 0 8px 18px rgba(18, 100, 232, 0.22); font-weight: 900; }
      .topbar-spacer { flex: 1; }
      .eyebrow { color: var(--brand); font-size: 11px; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; }
      .topbar .eyebrow { color: var(--muted); letter-spacing: 0.08em; }
      .health-chip, .tag { display: inline-flex; align-items: center; gap: 6px; width: fit-content; border-radius: 999px; padding: 7px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
      .health-chip { color: #176a4c; background: var(--success-soft); }
      .health-chip.loading { color: #735500; background: var(--opportunity-soft); }
      .health-chip.error { color: #964016; background: var(--attention-soft); }
      .health-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .tag.brand { color: var(--brand); background: var(--brand-soft); }
      .tag.opportunity { color: #735500; background: var(--opportunity-soft); }
      .tag.success { color: #176a4c; background: var(--success-soft); }
      .tag.attention { color: #964016; background: var(--attention-soft); }
      .tag.neutral { color: var(--muted); background: #eef4f7; }
      .top-actions { display: flex; align-items: center; gap: 10px; }

      .public-main, .workspace-main { max-width: 1180px; margin: 0 auto; padding: 56px 28px 84px; }
      .hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(310px, 0.85fr); gap: 46px; align-items: center; padding: 18px 0 58px; }
      .hero h1 { max-width: 670px; margin-top: 16px; font-size: clamp(40px, 6vw, 72px); line-height: 1.07; }
      .hero h1 span { color: var(--brand); }
      .hero-copy > p { max-width: 580px; margin-top: 20px; color: var(--muted); font-size: 17px; line-height: 1.8; }
      .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 28px; }
      .proof-row { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 34px; color: var(--muted); font-size: 12px; }
      .proof-row strong { display: block; margin-bottom: 3px; color: var(--ink); font-size: 14px; }
      .hero-visual { position: relative; min-height: 340px; padding: 26px; overflow: hidden; border-radius: 28px; background: linear-gradient(145deg, #1264e8 0%, #3182ef 100%); box-shadow: 0 26px 56px rgba(18, 100, 232, 0.24); }
      .hero-visual::before, .hero-visual::after { position: absolute; content: ""; border-radius: 50%; background: rgba(255,255,255,0.12); }
      .hero-visual::before { width: 250px; height: 250px; right: -78px; top: -95px; }
      .hero-visual::after { width: 160px; height: 160px; left: -74px; bottom: -68px; }
      .visual-window { position: relative; z-index: 1; height: 286px; padding: 20px; border-radius: 18px; background: rgba(255,255,255,0.96); box-shadow: 0 16px 34px rgba(15, 55, 100, 0.16); }
      .window-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 17px; border-bottom: 1px solid var(--line); }
      .window-lines { display: grid; gap: 8px; margin-top: 20px; }
      .window-line { height: 10px; border-radius: 5px; background: #e5eef3; }
      .window-line.short { width: 56%; }
      .window-line.blue { width: 78%; background: #cfe2ff; }
      .visual-score { position: absolute; right: 26px; bottom: 30px; display: grid; place-items: center; width: 94px; height: 94px; border: 8px solid var(--opportunity); border-radius: 50%; color: var(--ink); background: #fff; box-shadow: 0 12px 26px rgba(18, 100, 232, 0.18); }
      .visual-score strong { font-size: 28px; line-height: 1; }
      .visual-score small { color: var(--muted); font-size: 10px; }

      .section-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 20px; }
      .section-heading h2 { margin-top: 7px; font-size: 25px; }
      .section-heading p { max-width: 620px; color: var(--muted); font-size: 13px; line-height: 1.65; }
      .demo-flow { scroll-margin-top: 90px; }
      .step-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
      .step { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.75); }
      .step-no { flex: 0 0 auto; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; color: #735500; background: var(--opportunity); font-size: 12px; font-weight: 900; }
      .step strong { display: block; font-size: 14px; }
      .step span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.45; }
      .panel, .card { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
      .panel { padding: 24px; }
      .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .field-group { display: grid; gap: 8px; }
      .field-group label, .field-label { color: var(--ink); font-size: 12px; font-weight: 800; }
      .field, .textarea, .select { width: 100%; border: 1px solid #c8dce7; border-radius: 10px; color: var(--ink); background: #fbfdff; outline: 0; transition: border-color .16s, box-shadow .16s; }
      .field, .select { height: 44px; padding: 0 12px; }
      .textarea { min-height: 246px; padding: 12px; resize: vertical; line-height: 1.62; }
      .field:focus, .textarea:focus, .select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(18, 100, 232, 0.12); }
      .panel-head, .card-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
      .panel-head h3, .card-head h3 { font-size: 16px; }
      .panel-head p, .card-head p { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .panel-head { margin-bottom: 18px; }
      .button { display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 42px; padding: 0 16px; border: 1px solid transparent; border-radius: 10px; color: var(--ink); background: #eef4f7; font-size: 13px; font-weight: 800; text-decoration: none; }
      .button:hover { filter: brightness(.985); }
      .button.primary { color: #fff; background: var(--brand); box-shadow: 0 8px 18px rgba(18, 100, 232, 0.18); }
      .button.soft { color: var(--brand); background: var(--brand-soft); }
      .button.outline { color: var(--brand); border-color: #b9d3f6; background: #fff; }
      .button.link-button { min-height: auto; padding: 0; color: var(--brand); background: transparent; }
      .button.full { width: 100%; }
      .button.small { min-height: 34px; padding: 0 11px; font-size: 12px; }
      .form-foot { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 18px; }
      .muted { color: var(--muted); }
      .micro { color: var(--muted); font-size: 12px; line-height: 1.55; }
      .callout { display: flex; gap: 10px; margin-top: 16px; padding: 13px 14px; border-left: 3px solid var(--brand); border-radius: 10px; color: var(--muted); background: var(--brand-soft); font-size: 12px; line-height: 1.55; }
      .callout.opportunity { border-left-color: var(--opportunity); background: var(--opportunity-soft); color: #735500; }
      .callout.success { border-left-color: var(--success); background: var(--success-soft); color: #176a4c; }
      .callout.attention { border-left-color: var(--attention); background: var(--attention-soft); color: #964016; }
      .demo-result { margin-top: 22px; }
      .result-empty { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
      .empty-stage { min-height: 112px; padding: 16px; border-radius: 14px; background: #f7fafc; }
      .empty-stage strong { display: block; font-size: 14px; }
      .empty-stage p { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.55; }
      .progress-line { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: var(--muted); font-size: 12px; }
      .spinner { width: 15px; height: 15px; border: 2px solid #cfe2ff; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .log-line { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; color: var(--muted); font-size: 12px; }
      .log-line::before { content: "✓"; color: var(--success); font-weight: 900; }

      .report-top { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
      .score-block { display: grid; place-items: center; width: 176px; height: 176px; margin: 0 auto; border-radius: 50%; background: conic-gradient(var(--brand) calc(var(--score) * 1%), #e9f0f4 0); }
      .score-block::after { content: ""; grid-area: 1 / 1; width: 134px; height: 134px; border-radius: 50%; background: #fff; }
      .score-copy { position: relative; z-index: 1; grid-area: 1 / 1; display: grid; place-items: center; text-align: center; }
      .score-copy strong { font-size: 42px; letter-spacing: -0.05em; line-height: 1; }
      .score-copy span { margin-top: 7px; color: var(--muted); font-size: 12px; }
      .report-summary h3 { font-size: 20px; }
      .report-summary p { max-width: 660px; margin-top: 9px; color: var(--muted); line-height: 1.65; }
      .report-metrics { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      .metric-pill { padding: 10px 12px; border-radius: 11px; background: #f5f9fb; }
      .metric-pill strong { display: block; font-size: 16px; }
      .metric-pill span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
      .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
      .report-card { padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
      .report-card.full { grid-column: 1 / -1; }
      .report-card h3 { font-size: 16px; }
      .dimension { padding: 14px 0; border-bottom: 1px solid #edf3f6; }
      .dimension:last-child { border-bottom: 0; padding-bottom: 0; }
      .dimension-head { display: flex; justify-content: space-between; gap: 12px; }
      .dimension-head strong { font-size: 14px; }
      .dimension-head span { color: var(--brand); font-size: 13px; font-weight: 800; }
      .bar { height: 7px; margin-top: 10px; overflow: hidden; border-radius: 99px; background: #edf3f6; }
      .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
      .requirement { margin-top: 12px; padding: 12px; border-radius: 12px; background: #f7fafc; }
      .requirement-top { display: flex; align-items: flex-start; gap: 8px; }
      .requirement-top p { flex: 1; color: var(--ink); font-size: 13px; line-height: 1.55; }
      .evidence { margin-top: 9px; padding-left: 10px; border-left: 2px solid var(--success); color: var(--muted); font-size: 12px; line-height: 1.55; }
      .evidence.missing { border-left-color: var(--attention); color: #964016; }
      .condition-row { display: grid; grid-template-columns: 92px 82px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 0; border-bottom: 1px solid #edf3f6; font-size: 12px; }
      .condition-row:last-child { border-bottom: 0; }
      .condition-row > strong { font-size: 13px; }
      .condition-row > p { color: var(--muted); line-height: 1.55; }
      details.raw-report { margin-top: 18px; }
      details.raw-report summary { color: var(--brand); cursor: pointer; font-size: 12px; font-weight: 800; }
      details.raw-report pre { max-height: 330px; margin-top: 10px; padding: 14px; overflow: auto; border-radius: 10px; color: #36576d; background: #f5f9fb; white-space: pre-wrap; word-break: break-word; font-size: 11px; line-height: 1.55; }
      .version-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
      .version-chip { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: #fbfdff; font-size: 11px; }

      .auth-layout { display: grid; grid-template-columns: 1fr 420px; gap: 54px; align-items: center; min-height: calc(100vh - 160px); }
      .auth-story h1 { margin-top: 14px; font-size: clamp(40px, 6vw, 66px); line-height: 1.07; }
      .auth-story h1 span { color: var(--brand); }
      .auth-story > p { max-width: 600px; margin-top: 20px; color: var(--muted); font-size: 16px; line-height: 1.8; }
      .auth-points { display: grid; gap: 12px; margin-top: 30px; }
      .auth-point { display: flex; gap: 12px; align-items: center; }
      .auth-point::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--opportunity); box-shadow: 0 0 0 5px var(--opportunity-soft); }
      .auth-point strong { display: block; font-size: 14px; }
      .auth-point small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
      .auth-card { padding: 28px; border: 1px solid var(--line); border-radius: 20px; background: #fff; box-shadow: var(--shadow); }
      .auth-card h2 { font-size: 24px; }
      .auth-card > p { margin-top: 7px; color: var(--muted); font-size: 13px; }
      .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 24px 0 20px; padding: 4px; border-radius: 10px; background: #f1f6f8; }
      .auth-tab { height: 36px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 13px; font-weight: 800; }
      .auth-tab.active { color: var(--brand); background: #fff; box-shadow: 0 3px 10px rgba(25, 75, 112, 0.08); }
      .auth-fields { display: grid; gap: 15px; }
      .identity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .identity-card { display: grid; gap: 4px; min-height: 78px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; text-align: left; color: var(--ink); background: #fff; }
      .identity-card.active { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 2px rgba(18,100,232,.08); }
      .identity-card strong { font-size: 12px; }
      .identity-card small { color: var(--muted); font-size: 11px; line-height: 1.4; }
      .auth-foot { margin-top: 18px; color: var(--muted); font-size: 11px; line-height: 1.55; }

      .workspace-layout { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 34px; max-width: 1320px; margin: 0 auto; padding: 30px 28px 70px; }
      .sidebar { position: sticky; top: 96px; align-self: start; display: grid; gap: 26px; }
      .side-brand { display: flex; gap: 10px; align-items: center; font-weight: 800; }
      .side-brand small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 500; }
      .side-nav { display: grid; gap: 5px; }
      .nav-button { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 42px; padding: 0 12px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; text-align: left; font-size: 13px; font-weight: 700; }
      .nav-button:hover { color: var(--brand); background: var(--brand-soft); }
      .nav-button.active { color: var(--brand); background: var(--brand-soft); }
      .nav-button small { color: inherit; font-size: 10px; opacity: .75; }
      .side-note { padding: 15px; border-radius: 14px; background: var(--opportunity-soft); }
      .side-note strong { display: block; color: #735500; font-size: 12px; }
      .side-note p { margin-top: 6px; color: #806b22; font-size: 11px; line-height: 1.55; }
      .workspace-content { min-width: 0; }
      .page-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 24px; }
      .page-heading h1 { margin-top: 7px; font-size: 32px; }
      .page-heading p { max-width: 620px; margin-top: 7px; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .page-actions { display: flex; flex-wrap: wrap; gap: 9px; }
      .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; }
      .metric-card { padding: 18px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
      .metric-card strong { display: block; margin-top: 10px; font-size: 28px; letter-spacing: -0.04em; }
      .metric-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
      .content-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(300px, .88fr); gap: 18px; margin-top: 18px; }
      .card { padding: 20px; box-shadow: none; }
      .card-body { margin-top: 18px; }
      .card-list { display: grid; gap: 9px; }
      .list-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 13px; border-radius: 11px; background: #f7fafc; }
      .list-row strong { display: block; font-size: 13px; }
      .list-row small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
      .empty { display: grid; place-items: center; min-height: 145px; padding: 20px; border: 1px dashed #bed3df; border-radius: 13px; color: var(--muted); text-align: center; }
      .empty strong { color: var(--ink); font-size: 14px; }
      .empty p { max-width: 360px; margin-top: 7px; font-size: 12px; line-height: 1.6; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .form-card { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fbfdff; }
      .form-card .field-group + .field-group { margin-top: 13px; }
      .form-card .textarea { min-height: 140px; }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .document-item, .pool-item, .variant-item, .interview-item { padding: 15px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
      .document-item + .document-item, .pool-item + .pool-item, .variant-item + .variant-item, .interview-item + .interview-item { margin-top: 10px; }
      .item-title { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
      .item-title strong { font-size: 14px; }
      .item-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 11px; }
      .item-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
      .select-card { display: grid; gap: 7px; margin-top: 12px; }
      .select-card label { font-size: 11px; font-weight: 800; }
      .report-link { color: var(--brand); font-size: 12px; font-weight: 800; text-decoration: none; }
      .pool-detail { margin-bottom: 18px; border: 1px solid #b9d3f6; background: #f8fbff; }
      .pool-detail pre { max-height: 170px; margin-top: 12px; padding: 12px; overflow: auto; border-radius: 9px; white-space: pre-wrap; color: #36576d; background: #fff; font-size: 11px; line-height: 1.5; }
      .balance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .balance { padding: 17px; border-radius: 14px; background: #f7fafc; }
      .balance strong { display: block; margin-top: 8px; font-size: 26px; }
      .balance small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
      .usage-entry { display: grid; grid-template-columns: 100px 1fr 70px; gap: 10px; padding: 12px 0; border-bottom: 1px solid #edf3f6; font-size: 12px; }
      .usage-entry:last-child { border-bottom: 0; }
      .usage-entry span { color: var(--muted); }
      .usage-entry strong { text-align: right; }
      .interview-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; }
      .interview-nav { padding: 14px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
      .interview-nav .button { width: 100%; margin-bottom: 12px; }
      .interview-item { cursor: pointer; }
      .interview-item.active { border-color: var(--brand); background: var(--brand-soft); }
      .question { padding: 18px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
      .question h3 { margin-top: 9px; font-size: 19px; line-height: 1.5; }
      .answer-box { margin-top: 18px; }
      .answer-box .textarea { min-height: 160px; }
      .feedback-box { margin-top: 14px; padding: 13px; border-radius: 11px; background: var(--success-soft); color: #176a4c; font-size: 12px; line-height: 1.6; }
      .feedback-box ul { margin: 7px 0 0 17px; padding: 0; }
      .summary-box { padding: 17px; border-radius: 13px; background: var(--brand-soft); }
      .summary-box p { margin-top: 9px; color: var(--muted); font-size: 13px; line-height: 1.65; }
      .footer-note { margin-top: 38px; color: var(--muted); font-size: 11px; line-height: 1.6; text-align: center; }
      .toast { position: fixed; right: 24px; bottom: 24px; z-index: 30; max-width: 350px; padding: 13px 15px; border: 1px solid #b9e9d5; border-radius: 11px; color: #176a4c; background: #f2fff9; box-shadow: var(--shadow); font-size: 12px; font-weight: 700; }

      @media (max-width: 900px) {
        .topbar { padding: 11px 18px; }
        .topbar .eyebrow, .topbar .button.outline { display: none; }
        .public-main, .workspace-main { padding: 38px 18px 68px; }
        .hero, .auth-layout { grid-template-columns: 1fr; gap: 28px; }
        .hero { padding-top: 4px; }
        .hero-visual { max-width: 600px; }
        .workspace-layout { grid-template-columns: 1fr; padding: 20px 18px 60px; }
        .sidebar { position: static; gap: 13px; }
        .side-brand { display: none; }
        .side-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .nav-button { flex: 0 0 auto; width: auto; white-space: nowrap; }
        .side-note { display: none; }
      }
      @media (max-width: 680px) {
        .topbar { min-height: 62px; }
        .health-chip { padding: 6px 8px; font-size: 10px; }
        .topbar .button { min-height: 36px; padding: 0 10px; font-size: 11px; }
        .hero h1 { font-size: 42px; }
        .hero-copy > p { font-size: 15px; }
        .hero-visual { min-height: 280px; padding: 18px; border-radius: 20px; }
        .visual-window { height: 244px; }
        .visual-score { right: 20px; bottom: 22px; width: 82px; height: 82px; }
        .visual-score strong { font-size: 24px; }
        .step-strip, .input-grid, .result-empty, .report-grid, .two-col, .content-grid { grid-template-columns: 1fr; }
        .section-heading, .page-heading, .form-foot { align-items: flex-start; flex-direction: column; }
        .panel { padding: 17px; }
        .report-top { grid-template-columns: 1fr; }
        .score-block { width: 150px; height: 150px; }
        .score-block::after { width: 114px; height: 114px; }
        .score-copy strong { font-size: 36px; }
        .report-card.full { grid-column: auto; }
        .condition-row { grid-template-columns: 1fr 80px; }
        .condition-row > p { grid-column: 1 / -1; }
        .metric-grid, .balance-grid { grid-template-columns: 1fr 1fr; }
        .interview-layout { grid-template-columns: 1fr; }
        .identity-grid, .form-row { grid-template-columns: 1fr; }
        .auth-layout { min-height: 0; }
        .auth-story { padding-top: 4px; }
        .auth-story h1 { font-size: 43px; }
        .toast { right: 14px; bottom: 14px; left: 14px; max-width: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        "use strict";

        const app = document.querySelector("#app");
        const SESSION_KEY = "purslyx-web-session-v1";
        const DEFAULT_RESUME = `张三
工作经历：
负责 React 前端项目开发，使用 TypeScript 和 Vue 完成组件设计。
通过性能优化和自动化测试提升交付质量。
项目经历：
参与用户后台改版，推动需求分析、开发和上线。`;
        const DEFAULT_JOB = `前端开发工程师
公司：示例科技
地点：杭州
薪资：18K-28K
任职要求：
1、熟悉 React 或 Vue 与 TypeScript
2、负责前端项目开发和交付
3、关注性能优化与自动化测试`;

        const state = {
          screen: "demo",
          health: { status: "loading", environment: "201", backend: "PostgreSQL" },
          toast: "",
          demo: {
            resumeTitle: "演示简历",
            resumeText: DEFAULT_RESUME,
            jobTitle: "前端开发工程师 JD",
            jobText: DEFAULT_JOB,
            running: false,
            phase: "等待执行",
            logs: [],
            result: null,
            error: "",
          },
          auth: { mode: "login", email: "", password: "", role: "seeker", error: "", running: false },
          session: loadSession(),
          workspace: {
            page: "dashboard",
            loading: false,
            loaded: false,
            error: "",
            requestNo: 0,
            selectedPool: null,
            selectedAnalysis: null,
            selectedInterview: null,
            selectedVariant: null,
            lastExport: null,
            data: { documents: [], preferences: [], pool: [], analyses: [], interviews: [], variants: [], usage: null, stats: null },
          },
        };

        function loadSession() {
          try {
            const stored = sessionStorage.getItem(SESSION_KEY);
            return stored ? JSON.parse(stored) : { token: "", csrf: "", account: null };
          } catch (_) {
            return { token: "", csrf: "", account: null };
          }
        }

        function saveSession() {
          if (!state.session.token) {
            sessionStorage.removeItem(SESSION_KEY);
            return;
          }
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(state.session));
        }

        function clearSession() {
          state.session = { token: "", csrf: "", account: null };
          saveSession();
          state.workspace.loaded = false;
          state.workspace.data = { documents: [], preferences: [], pool: [], analyses: [], interviews: [], variants: [], usage: null, stats: null };
        }

        function esc(value) {
          return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        function key(prefix) {
          const random = Math.random().toString(36).slice(2, 10);
          return `${prefix}-${Date.now()}-${random}`;
        }

        function json(value) {
          return JSON.stringify(value, null, 2);
        }

        function number(value, fallback = "—") {
          const parsed = Number(value);
          return Number.isFinite(parsed) ? String(parsed) : fallback;
        }

        function percent(value, fallback = "—") {
          const parsed = Number(value);
          return Number.isFinite(parsed) ? `${Math.round(parsed * 100)}%` : fallback;
        }

        function date(value) {
          if (!value) return "—";
          const parsed = new Date(value);
          if (Number.isNaN(parsed.getTime())) return "—";
          return parsed.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
        }

        function labelStatus(value) {
          return {
            supported: "有依据",
            partially_supported: "部分依据",
            gap: "存在差距",
            needs_confirmation: "待确认",
            matched: "符合",
            conflicted: "条件冲突",
            unknown: "未知",
            available: "已完成",
            succeeded: "已完成",
            queued: "排队中",
            running: "处理中",
            awaiting_requirements: "待分析",
            failed: "失败",
            completed: "已完成",
            confirmed: "已确认",
            ended_early: "提前结束",
            awaiting_answer: "等待回答",
            processing: "处理中",
          }[value] || value || "未知";
        }

        function statusClass(value) {
          if (["supported", "matched", "available", "succeeded", "completed"].includes(value)) return "success";
          if (["gap", "conflicted", "failed"].includes(value)) return "attention";
          if (["needs_confirmation", "unknown", "queued", "running", "awaiting_requirements", "processing", "awaiting_answer"].includes(value)) return "opportunity";
          return "neutral";
        }

        class ApiError extends Error {
          constructor(status, code, message, action) {
            super(message);
            this.status = status;
            this.code = code;
            this.action = action;
          }
        }

        async function request(path, options = {}) {
          const method = String(options.method || "GET").toUpperCase();
          const headers = { Accept: "application/json", ...(options.headers || {}) };
          const formal = Boolean(options.formal);
          if (formal && state.session.token) headers.Authorization = `Bearer ${state.session.token}`;
          if (formal && !["GET", "HEAD", "OPTIONS"].includes(method) && state.session.csrf) headers["X-CSRF-Token"] = state.session.csrf;
          if (options.idempotencyKey) headers["Idempotency-Key"] = options.idempotencyKey;
          const init = { method, headers, credentials: "same-origin", cache: "no-store" };
          if (options.body !== undefined) {
            headers["Content-Type"] = "application/json";
            init.body = JSON.stringify(options.body);
          }
          const response = await fetch(path, init);
          let payload = null;
          try {
            payload = await response.json();
          } catch (_) {
            payload = null;
          }
          if (!response.ok) {
            const error = payload && payload.error ? payload.error : {};
            throw new ApiError(response.status, error.code || "REQUEST_FAILED", error.message || `请求失败（${response.status}）`, error.action);
          }
          return payload && Object.prototype.hasOwnProperty.call(payload, "data") ? payload.data : payload;
        }

        async function loadHealth() {
          try {
            const response = await fetch("/health", { cache: "no-store" });
            const payload = await response.json();
            if (!response.ok || payload.status !== "ok" || payload.database?.backend !== "postgresql") throw new Error("201 PostgreSQL 不可用");
            state.health = { status: "ok", environment: payload.environment || "201", backend: "PostgreSQL" };
          } catch (_) {
            state.health = { status: "error", environment: "201", backend: "PostgreSQL" };
          }
          render();
        }

        function healthChip() {
          const cls = state.health.status === "ok" ? "" : state.health.status === "loading" ? "loading" : "error";
          const text = state.health.status === "ok" ? `${state.health.environment} · PostgreSQL 已连接` : state.health.status === "loading" ? "正在检查 201 PostgreSQL" : "201 PostgreSQL · 未连接";
          return `<span class="health-chip ${cls}"><i class="health-dot"></i>${esc(text)}</span>`;
        }

        function topbar() {
          return `<header class="topbar">
            <button class="brand-button" data-action="home" aria-label="回到 Purslyx 首页"><span class="brand-mark">P</span><span>Purslyx</span></button>
            <span class="eyebrow">SDD 最小纵向切片</span>
            <div class="topbar-spacer"></div>
            ${healthChip()}
            <div class="top-actions">
              <a class="button outline" href="/docs" target="_blank" rel="noreferrer">查看 API</a>
              ${state.screen === "formal" ? (state.session.account ? `<button class="button soft" data-action="logout">退出工作台</button>` : `<button class="button primary" data-action="home">回到最短演示</button>`) : `<button class="button primary" data-action="formal">进入正式工作台</button>`}
            </div>
          </header>`;
        }

        function appFrame(content) {
          return `${topbar()}${content}${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ""}`;
        }

        function demoPage() {
          const demo = state.demo;
          return `<main class="public-main">
            <section class="hero">
              <div class="hero-copy">
                <div class="eyebrow">201 POSTGRESQL · DEMO SLICE</div>
                <h1>从真实经历，<span>走到下一步。</span></h1>
                <p>明天的 SDD 演示只承诺一条能复跑的闭环：资料先整理成草稿，再确认不可变版本，最后产出有证据的岗位匹配报告。</p>
                <div class="hero-actions">
                  <button class="button primary" data-action="demo-scroll">开始最短闭环 ↓</button>
                  <a class="button" href="/health" target="_blank" rel="noreferrer">打开健康检查</a>
                </div>
                <div class="proof-row">
                  <div><strong>固定规则</strong>分数由代码计算</div>
                  <div><strong>可复核</strong>报告保存输入版本</div>
                  <div><strong>可落地</strong>直连 201 PostgreSQL</div>
                </div>
              </div>
              <div class="hero-visual" aria-hidden="true">
                <div class="visual-window">
                  <div class="window-top"><strong>匹配报告</strong><span class="tag success">有依据</span></div>
                  <div class="window-lines"><i class="window-line blue"></i><i class="window-line"></i><i class="window-line short"></i><i class="window-line"></i><i class="window-line blue short"></i></div>
                  <div class="visual-score"><div><strong>82</strong><small>综合分</small></div></div>
                </div>
              </div>
            </section>

            <section id="demo-flow" class="demo-flow">
              <div class="section-heading"><div><div class="eyebrow">SHORTEST PATH</div><h2>把需求现场跑出来</h2></div><p>页面只调用隔离的 <code>/api/v1/demo</code> 短入口；正式账号、CSRF、幂等和用量链路可从“正式工作台”进入。</p></div>
              <div class="step-strip">
                <div class="step"><b class="step-no">01</b><div><strong>输入资料</strong><span>简历和 JD 先生成可检查草稿</span></div></div>
                <div class="step"><b class="step-no">02</b><div><strong>确认版本</strong><span>草稿确认后冻结为 version 1</span></div></div>
                <div class="step"><b class="step-no">03</b><div><strong>读取报告</strong><span>能力分、覆盖率、依据和条件状态</span></div></div>
              </div>
              <form id="demo-form" class="panel">
                <div class="panel-head"><div><h3>最短演示输入</h3><p>使用页面内的虚构资料即可；提交不会要求登录，也不会把密码写入前端。</p></div><span class="tag opportunity">文字输入</span></div>
                <div class="input-grid">
                  <div class="field-group"><label for="demo-resume-title">简历名称</label><input id="demo-resume-title" class="field" name="resume_title" value="${esc(demo.resumeTitle)}" /><label for="demo-resume-text">简历正文</label><textarea id="demo-resume-text" class="textarea" name="resume_text">${esc(demo.resumeText)}</textarea></div>
                  <div class="field-group"><label for="demo-job-title">岗位名称</label><input id="demo-job-title" class="field" name="job_title" value="${esc(demo.jobTitle)}" /><label for="demo-job-text">岗位 JD</label><textarea id="demo-job-text" class="textarea" name="job_text">${esc(demo.jobText)}</textarea></div>
                </div>
                <div class="form-foot"><span class="micro">当前口径：本地开发环境.md → 201 PostgreSQL；SQLite 已禁止。</span><button class="button primary" type="submit" ${demo.running ? "disabled" : ""}>${demo.running ? "正在生成报告…" : "确认版本并生成报告"}</button></div>
                ${demo.error ? `<div class="callout attention">${esc(demo.error)}</div>` : ""}
                ${demo.running ? `<div class="progress-line"><i class="spinner"></i><span>${esc(demo.phase)}</span></div>` : ""}
                ${demo.logs.map((item) => `<div class="log-line">${esc(item)}</div>`).join("")}
              </form>
              <section class="demo-result panel">
                <div class="panel-head"><div><h3>可复核输出</h3><p>报告会从 PostgreSQL 重新落库读取所需的事实；演示时可展开原始 JSON 对照接口返回。</p></div>${demo.result ? `<span class="tag success">已落库</span>` : `<span class="tag neutral">等待执行</span>`}</div>
                ${demo.result ? demoReport(demo.result) : `<div class="result-empty"><div class="empty-stage"><strong>资料草稿</strong><p>系统先提取结构化内容，避免直接把原文当成结论。</p></div><div class="empty-stage"><strong>冻结版本</strong><p>确认动作产生带 version_no 的不可变输入。</p></div><div class="empty-stage"><strong>匹配报告</strong><p>每条要求回到简历证据，未知不会被写成不具备。</p></div>`}
              </section>
            </section>
            <p class="footer-note">Purslyx · 这是明日 SDD 的可复核最小闭环。真实模型、队列 Worker、邮件和外部平台投递不作为本次启动前置条件。</p>
          </main>`;
        }

        function demoReport(result) {
          const report = result.analysis?.report || {};
          const score = Number(report.ability_score);
          const scoreValue = Number.isFinite(score) ? score : 0;
          const advice = report.overall_advice || {};
          const dimensions = Array.isArray(report.dimensions) ? report.dimensions : [];
          const conditions = Array.isArray(report.conditions) ? report.conditions : [];
          return `<div class="report-top">
            <div class="score-block" style="--score:${Math.max(0, Math.min(scoreValue, 100))}"><div class="score-copy"><strong>${Number.isFinite(score) ? esc(number(score)) : "—"}</strong><span>能力综合分</span></div></div>
            <div class="report-summary"><span class="tag ${statusClass(advice.status)}">${esc(labelStatus(advice.status))}</span><h3>${esc(advice.text || "报告已生成")}</h3><p>${esc((advice.next_steps || []).join(" ") || "请结合证据和条件对照做人工判断。")}</p><div class="report-metrics"><div class="metric-pill"><strong>${esc(percent(report.evidence_coverage))}</strong><span>证据覆盖率</span></div><div class="metric-pill"><strong>${esc(String(dimensions.filter((item) => item.score !== null && item.score !== undefined).length))}</strong><span>可评分维度</span></div><div class="metric-pill"><strong>${esc(String(result.analysis?.scoring_rule_version || report.scoring_rule_version || "ability-v0.1"))}</strong><span>评分规则</span></div></div></div>
          </div>
          <div class="report-grid">
            <div class="report-card"><h3>能力维度与逐条依据</h3>${dimensions.map((dimension) => demoDimension(dimension)).join("") || `<div class="empty">暂无维度数据</div>`}</div>
            <div class="report-card"><h3>岗位条件对照</h3><div style="margin-top:8px">${conditions.map((item) => `<div class="condition-row"><strong>${esc({ job_title: "岗位方向", location: "地点", work_mode: "办公方式", salary: "薪资" }[item.condition] || item.condition)}</strong><span class="tag ${statusClass(item.status)}">${esc(labelStatus(item.status))}</span><p>${esc(item.explanation)}</p></div>`).join("") || `<div class="empty">没有条件数据</div>`}</div></div>
            <div class="report-card full"><h3>输入版本</h3><div class="version-strip"><span class="version-chip">简历 · ${esc(result.resume?.version?.id || "—")} · v${esc(result.resume?.version?.version_no || "—")}</span><span class="version-chip">岗位 · ${esc(result.job?.version?.id || "—")} · v${esc(result.job?.version?.version_no || "—")}</span><span class="version-chip">分析 · ${esc(result.analysis?.id || "—")}</span></div><details class="raw-report"><summary>展开报告 JSON（用于讲接口与落库）</summary><pre>${esc(json(result))}</pre></details></div>
          </div>`;
        }

        function demoDimension(dimension) {
          const score = Number(dimension.score);
          const width = Number.isFinite(score) ? Math.max(0, Math.min(score, 100)) : 0;
          return `<div class="dimension"><div class="dimension-head"><strong>${esc(dimension.label)}</strong><span>${Number.isFinite(score) ? `${esc(number(score))} 分` : "不适用"}</span></div>${Number.isFinite(score) ? `<div class="bar"><i style="width:${width}%"></i></div>` : ""}${(dimension.requirements || []).map((item) => `<div class="requirement"><div class="requirement-top"><span class="tag ${statusClass(item.status)}">${esc(labelStatus(item.status))}</span><p>${esc(item.job_quote)}</p></div>${item.evidence?.length ? `<div class="evidence">依据：${esc(item.evidence.map((evidence) => evidence.quote).join("；"))}</div>` : `<div class="evidence missing">暂无对应原文依据：保留为待确认，不直接判定为不具备。</div>`}</div>`).join("")}</div>`;
        }

        function authPage() {
          const auth = state.auth;
          return `<main class="public-main"><section class="auth-layout">
            <div class="auth-story"><div class="eyebrow">FORMAL WORKBENCH</div><h1>让每一次判断，<span>都回到依据。</span></h1><p>正式工作台走完整的账号、CSRF、幂等和用量链路。明天现场先用右侧登录，再从简历、匹配池、报告和面试恢复真实数据。</p><div class="auth-points"><div class="auth-point"><div><strong>资料与版本分开</strong><small>草稿可检查，确认后才进入冻结版本。</small></div></div><div class="auth-point"><div><strong>岗位期望单独成组</strong><small>未知、不限和面议保持不同语义。</small></div></div><div class="auth-point"><div><strong>操作可重试</strong><small>写请求带 CSRF 和 Idempotency-Key。</small></div></div></div></div>
            <form id="auth-form" class="auth-card"><h2>${auth.mode === "register" ? "创建正式账号" : "欢迎回来"}</h2><p>${auth.mode === "register" ? "注册时选择固定身份；本地演示会自动完成验证。" : "登录后继续本账号的资料、岗位和历史任务。"}</p><div class="auth-tabs"><button class="auth-tab ${auth.mode === "login" ? "active" : ""}" type="button" data-action="auth-mode" data-mode="login">登录</button><button class="auth-tab ${auth.mode === "register" ? "active" : ""}" type="button" data-action="auth-mode" data-mode="register">注册</button></div><div class="auth-fields">${auth.mode === "register" ? `<div class="field-group"><span class="field-label">注册身份</span><div class="identity-grid"><button class="identity-card ${auth.role === "seeker" ? "active" : ""}" type="button" data-action="auth-role" data-role="seeker"><strong>我要找工作</strong><small>简历、匹配池、面试练习</small></button><button class="identity-card ${auth.role === "recruiter" ? "active" : ""}" type="button" data-action="auth-role" data-role="recruiter"><strong>我要招人</strong><small>岗位与候选人单人分析</small></button></div></div>` : ""}<div class="field-group"><label for="auth-email">邮箱</label><input id="auth-email" class="field" type="email" name="email" autocomplete="email" value="${esc(auth.email)}" placeholder="name@example.com" required /></div><div class="field-group"><label for="auth-password">密码</label><input id="auth-password" class="field" type="password" name="password" autocomplete="current-password" value="${esc(auth.password)}" placeholder="至少 12 个字符" required /></div><button class="button primary full" type="submit" ${auth.running ? "disabled" : ""}>${auth.running ? "正在处理…" : auth.mode === "register" ? "注册并进入工作台" : "登录"}</button></div>${auth.error ? `<div class="callout attention">${esc(auth.error)}</div>` : ""}<div class="auth-foot">正式工作台使用当前进程的 201 PostgreSQL。这里不会显示或保存本地开发环境文件中的密码。</div></form>
          </section></main>`;
        }

        function workspaceShell() {
          const account = state.session.account || {};
          const seeker = account.registration_role === "seeker";
          const nav = seeker
            ? [["dashboard", "工作台", "总览"], ["resume", "简历与期望", "资料"], ["pool", "匹配池", "岗位"], ["variants", "岗位版简历", "成品"], ["interview", "面试练习", "复盘"], ["usage", "用量", "次数"], ["stats", "统计", "反馈"]]
            : [["dashboard", "工作台", "总览"], ["resume", "候选人资料", "资料"], ["usage", "用量", "次数"], ["stats", "统计", "反馈"]];
          return `<div class="workspace-layout"><aside class="sidebar"><div class="side-brand"><span class="brand-mark">P</span><div>Purslyx<small>${seeker ? "求职工作台" : "招聘工作台"}</small></div></div><nav class="side-nav">${nav.map((item) => `<button class="nav-button ${state.workspace.page === item[0] ? "active" : ""}" data-page="${item[0]}"><span>${item[1]}</span><small>${item[2]}</small></button>`).join("")}</nav><div class="side-note"><strong>今天只做下一步</strong><p>页面是业务入口，结论仍回到已确认资料、冻结版本和可解释规则。</p></div></aside><main class="workspace-content">${workspaceContent()}</main></div>`;
        }

        function workspaceContent() {
          if (state.workspace.loading && !state.workspace.loaded) return `<div class="empty" style="min-height:260px"><div><i class="spinner" style="display:inline-block"></i><p style="margin-top:12px">正在从 201 PostgreSQL 读取工作台…</p></div></div>`;
          const page = state.workspace.page;
          const content = page === "dashboard" ? dashboardPage() : page === "resume" ? resumePage() : page === "pool" ? poolPage() : page === "report" ? formalReportPage() : page === "variants" ? variantsPage() : page === "interview" ? interviewPage() : page === "usage" ? usagePage() : statsPage();
          return `${state.workspace.error ? `<div class="callout attention" style="margin-bottom:18px">${esc(state.workspace.error)}</div>` : ""}${content}`;
        }

        function heading(eyebrow, title, description, actions = "") {
          return `<div class="page-heading"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>${actions ? `<div class="page-actions">${actions}</div>` : ""}</div>`;
        }

        function dashboardPage() {
          const data = state.workspace.data;
          const stats = data.stats || {};
          const account = state.session.account || {};
          return `${heading(account.registration_role === "seeker" ? "SEEKER WORKSPACE" : "RECRUITER WORKSPACE", "工作台", "这里保留最近输入、当前报告和下一步动作；刷新页面仍从数据库恢复。", `<button class="button outline small" data-action="refresh">刷新数据</button>`)}<div class="metric-grid"><div class="metric-card"><div class="eyebrow">资料</div><strong>${esc(String(data.documents.length))}</strong><span>已导入资料</span></div><div class="metric-card"><div class="eyebrow">分析</div><strong>${esc(String(stats.completed_analyses ?? data.analyses.length))}</strong><span>已完成报告</span></div><div class="metric-card"><div class="eyebrow">面试</div><strong>${esc(String(stats.interviews ?? data.interviews.length))}</strong><span>练习会话</span></div><div class="metric-card"><div class="eyebrow">去投递</div><strong>${esc(String(stats.apply_clicks ?? 0))}</strong><span>点击记录，不等于已投递</span></div></div><div class="content-grid"><section class="card"><div class="card-head"><div><h3>继续下一步</h3><p>从当前账号的真实状态进入，不另造一套演示数据。</p></div></div><div class="card-body"><div class="card-list">${account.registration_role === "seeker" ? `<div class="list-row"><div><strong>补齐简历与岗位期望</strong><small>先确认输入，后续分析才有稳定版本。</small></div><button class="button soft small" data-page="resume">去准备</button></div><div class="list-row"><div><strong>保存岗位并生成报告</strong><small>选择一条期望，确认消耗 1 次分析机会。</small></div><button class="button soft small" data-page="pool">去匹配</button></div><div class="list-row"><div><strong>恢复面试练习</strong><small>已开始的会话可以从当前题目继续。</small></div><button class="button soft small" data-page="interview">去面试</button></div>` : `<div class="list-row"><div><strong>导入候选人资料</strong><small>岗位和候选人简历确认后，再发起单人分析。</small></div><button class="button soft small" data-page="resume">去准备</button></div>`}</div></div></section><section class="card"><div class="card-head"><div><h3>最近分析</h3><p>报告只读本账号拥有的输入版本。</p></div></div><div class="card-body">${data.analyses.length ? `<div class="card-list">${data.analyses.slice(0, 4).map((item) => `<div class="list-row"><div><strong>${esc(item.job_category || "岗位分析")}</strong><small>${esc(labelStatus(item.status))} · ${esc(number(item.ability_score))} 分 · ${esc(date(item.completed_at))}</small></div><button class="button link-button" data-action="open-analysis" data-id="${esc(item.id)}">查看</button></div>`).join("")}</div>` : `<div class="empty"><div><strong>还没有报告</strong><p>从“简历与期望”开始，准备一份可复核的输入。</p></div></div>`}</div></section></div>`;
        }

        function resumePage() {
          const seeker = state.session.account?.registration_role === "seeker";
          const documents = state.workspace.data.documents.filter((item) => seeker ? item.document_type === "resume" : ["resume", "job_description"].includes(item.document_type));
          const preferences = state.workspace.data.preferences;
          return `${heading(seeker ? "RESUME" : "CANDIDATE MATERIALS", seeker ? "简历与岗位期望" : "候选人资料", seeker ? "把简历和每条岗位期望分别确认；分析时只引用本次选中的版本。" : "岗位描述和候选人简历分别确认，再创建一份单人分析。", `<button class="button outline small" data-action="refresh">刷新</button>`)}<div class="two-col"><section class="card"><div class="card-head"><div><h3>${seeker ? "我的确认资料" : "导入资料"}</h3><p>${seeker ? "当前页面的最小可用入口是粘贴文字；文件导入接口已保留。" : "招聘身份可分别导入岗位描述与候选人简历。"}</p></div></div><div class="card-body"><form id="formal-document-form" class="form-card">${!seeker ? `<div class="field-group"><label for="formal-document-type">资料类型</label><select id="formal-document-type" class="select" name="document_type"><option value="resume">候选人简历</option><option value="job_description">岗位 JD</option></select></div>` : `<input type="hidden" name="document_type" value="resume" />`}<div class="field-group"><label for="formal-document-title">名称</label><input id="formal-document-title" class="field" name="title" value="${seeker ? "我的确认简历" : "候选人资料"}" required /></div><div class="field-group"><label for="formal-document-text">正文</label><textarea id="formal-document-text" class="textarea" name="text" placeholder="粘贴文字内容……" required>${seeker ? esc(DEFAULT_RESUME) : ""}</textarea></div><div class="form-foot"><span class="micro">提交后会先生成草稿，再用当前 revision 确认版本。</span><button class="button primary small" type="submit">导入并确认</button></div></form><div style="margin-top:16px">${documents.length ? documents.map((item) => documentItem(item)).join("") : `<div class="empty"><div><strong>还没有资料</strong><p>从右侧表单粘贴一份文字资料，完成后会出现 version 1。</p></div></div>`}</div></div></section>${seeker ? `<section class="card"><div class="card-head"><div><h3>岗位期望</h3><p>未填写不等于不限；每组条件独立保存为版本。</p></div></div><div class="card-body"><form id="preference-form" class="form-card"><div class="field-group"><label for="preference-title">期望岗位</label><input id="preference-title" class="field" name="job_title" value="前端工程师" required /></div><div class="form-row"><div class="field-group"><label for="preference-location">期望地点</label><input id="preference-location" class="field" name="location" value="杭州" required /></div><div class="field-group"><label for="preference-mode">办公方式</label><select id="preference-mode" class="select" name="work_mode"><option value="onsite">现场办公</option><option value="hybrid">混合办公</option><option value="remote">远程</option></select></div></div><div class="form-row"><div class="field-group"><label for="preference-min">月薪下限（K）</label><input id="preference-min" class="field" name="min_salary" inputmode="decimal" value="18" required /></div><div class="field-group"><label for="preference-max">月薪上限（K）</label><input id="preference-max" class="field" name="max_salary" inputmode="decimal" value="28" required /></div></div><div class="form-foot"><span class="micro">示例按税前月薪 CNY 保存。</span><button class="button primary small" type="submit">保存这条期望</button></div></form><div style="margin-top:16px">${preferences.length ? preferences.map((item) => preferenceItem(item)).join("") : `<div class="empty"><div><strong>还没有岗位期望</strong><p>保存后，匹配池会要求明确选择一条。</p></div></div>`}</div></div></section>` : recruiterAnalysisSection(documents)}</div>`;
        }

        function documentItem(item) {
          const version = item.latest_version;
          return `<article class="document-item"><div class="item-title"><strong>${esc(item.title)}</strong><span class="tag ${statusClass(item.status)}">${esc(labelStatus(item.status))}</span></div><div class="item-meta"><span>${esc(item.document_type === "job_description" ? "岗位 JD" : "简历")}</span><span>revision ${esc(item.revision)}</span><span>${version ? `version ${esc(version.version_no)}` : "待确认版本"}</span></div>${version ? `<div class="micro" style="margin-top:9px">冻结版本：${esc(version.id)}</div>` : ""}</article>`;
        }

        function preferenceItem(item) {
          const content = item.version?.content || {};
          const location = content.locations?.values?.join("、") || labelStatus(content.locations?.status);
          const salary = content.salary?.status === "specified" ? `${content.salary.min}–${content.salary.max}K` : labelStatus(content.salary?.status);
          return `<article class="document-item"><div class="item-title"><strong>${esc(item.display_name)}</strong>${item.is_default ? `<span class="tag success">默认</span>` : ""}</div><div class="item-meta"><span>${esc(content.job_title?.value || "未知岗位")}</span><span>${esc(location)}</span><span>${esc(salary)}</span></div><div class="micro" style="margin-top:9px">期望版本 v${esc(item.version?.version_no || "—")} · ${esc(item.version?.id || "—")}</div></article>`;
        }

        function recruiterAnalysisSection(documents) {
          const resumes = documents.filter((item) => item.document_type === "resume" && item.subject_type === "candidate_resume" && item.latest_version);
          const jobs = documents.filter((item) => item.document_type === "job_description" && item.latest_version);
          return `<section class="card" style="margin-top:18px"><div class="card-head"><div><h3>创建单人分析</h3><p>招聘身份不进入求职者匹配池；报告只绑定一位候选人的简历版本和一个岗位版本。</p></div></div><div class="card-body"><form id="recruiter-analysis-form" class="form-card"><div class="field-group"><label>候选人简历版本</label><select class="select" name="resume_version_id" ${resumes.length ? "" : "disabled"}>${resumes.map((item) => `<option value="${esc(item.latest_version.id)}">${esc(item.title)} · v${esc(item.latest_version.version_no)}</option>`).join("") || `<option>请先导入候选人简历</option>`}</select></div><div class="field-group"><label>岗位版本</label><select class="select" name="job_version_id" ${jobs.length ? "" : "disabled"}>${jobs.map((item) => `<option value="${esc(item.latest_version.id)}">${esc(item.title)} · v${esc(item.latest_version.version_no)}</option>`).join("") || `<option>请先导入岗位 JD</option>`}</select></div><div class="form-foot"><span class="micro">开始分析确认消耗 1 次分析机会。</span><button class="button primary small" type="submit" ${resumes.length && jobs.length ? "" : "disabled"}>开始分析</button></div></form></div></section>`;
        }

        function poolPage() {
          const data = state.workspace.data;
          const resumes = data.documents.filter((item) => item.document_type === "resume" && item.latest_version);
          const preferences = data.preferences.filter((item) => item.version);
          const selected = state.workspace.selectedPool;
          return `${heading("MATCH POOL", "匹配池", "岗位先保存，选定一条岗位期望并确认消耗后，才生成岗位独立的匹配报告。", `<button class="button outline small" data-action="refresh">刷新</button>`)}${selected ? `<section class="card pool-detail"><div class="card-head"><div><h3>${esc(selected.job_title || "岗位详情")}</h3><p>${esc(selected.company_name || "未标注公司")} · ${esc(labelStatus(selected.analysis_status))}</p></div><button class="button link-button small" data-action="close-pool">收起</button></div><pre>${esc(json(selected.job_content || selected.job_fields || {}))}</pre>${selected.latest_analysis ? `<div class="item-actions"><button class="button primary small" data-action="open-analysis" data-id="${esc(selected.latest_analysis.id)}">打开完整报告</button></div>` : ""}</section>` : ""}<div class="content-grid"><section class="card"><div class="card-head"><div><h3>保存一份手动岗位</h3><p>浏览器草稿也会落到同一岗位池契约；这里用文字输入完成明天的稳定演示。</p></div><span class="tag opportunity">可选分析</span></div><div class="card-body"><form id="pool-form" class="form-card"><div class="field-group"><label for="pool-title">岗位名称</label><input id="pool-title" class="field" name="job_title" value="前端开发工程师" required /></div><div class="field-group"><label for="pool-company">公司</label><input id="pool-company" class="field" name="company_name" value="示例科技" /></div><div class="field-group"><label for="pool-text">岗位 JD</label><textarea id="pool-text" class="textarea" name="job_text" required>${esc(DEFAULT_JOB)}</textarea></div><div class="field-group"><label for="pool-resume">本次使用的简历版本</label><select id="pool-resume" class="select" name="resume_version_id" ${resumes.length ? "" : "disabled"}>${resumes.map((item) => `<option value="${esc(item.latest_version.id)}">${esc(item.title)} · v${esc(item.latest_version.version_no)}</option>`).join("") || `<option>请先去简历页确认版本</option>`}</select></div><div class="field-group"><label for="pool-preference">本次使用的岗位期望版本</label><select id="pool-preference" class="select" name="preference_version_id" ${preferences.length ? "" : "disabled"}>${preferences.map((item) => `<option value="${esc(item.version.id)}">${esc(item.display_name)} · v${esc(item.version.version_no)}</option>`).join("") || `<option>请先去简历页保存期望</option>`}</select></div><label class="micro" style="display:flex;gap:8px;align-items:flex-start;margin-top:14px"><input type="checkbox" name="start_now" checked style="margin-top:3px" /> 保存后立即生成报告（确认消耗 1 次分析机会）</label><div class="form-foot"><span class="micro">只保存岗位不会扣次；分析需要简历、期望和余额齐备。</span><button class="button primary small" type="submit">保存岗位</button></div></form></div></section><section class="card"><div class="card-head"><div><h3>岗位列表</h3><p>每个岗位拥有自己的报告和输入版本。</p></div></div><div class="card-body">${data.pool.length ? data.pool.map((item) => poolItem(item)).join("") : `<div class="empty"><div><strong>匹配池还是空的</strong><p>准备好简历和期望后，在左侧保存第一份岗位。</p></div></div>`}</div></section></div>`;
        }

        function poolItem(item) {
          const latest = item.latest_analysis;
          return `<article class="pool-item"><div class="item-title"><strong>${esc(item.job_title || "未命名岗位")}</strong><span class="tag ${statusClass(item.analysis_status)}">${esc(labelStatus(item.analysis_status))}</span></div><div class="item-meta"><span>${esc(item.company_name || "未标注公司")}</span><span>${latest ? `综合分 ${esc(number(latest.ability_score))}` : "尚无报告"}</span><span>${esc(date(item.updated_at))}</span></div><div class="item-actions"><button class="button soft small" data-action="open-pool" data-id="${esc(item.id)}">查看岗位</button>${latest ? `<button class="button outline small" data-action="open-analysis" data-id="${esc(latest.id)}">完整报告</button>` : ""}</div></article>`;
        }

        function formalReportPage() {
          const analysis = state.workspace.selectedAnalysis;
          if (!analysis) return `${heading("REPORT", "匹配报告", "从匹配池或工作台选择一份报告。", `<button class="button outline small" data-page="pool">回到匹配池</button>`)}<div class="empty"><div><strong>还没有选中的报告</strong><p>报告会在生成后保存，并可从历史入口重新打开。</p></div></div>`;
          const report = analysis.report || {};
          const score = Number(analysis.ability_score ?? report.ability_score);
          const advice = report.overall_advice || {};
          const pool = state.workspace.selectedPool || findPoolForAnalysis(analysis.id);
          const resumeId = analysis.input_versions?.find((item) => item && item.type === "resume")?.id;
          return `${heading("MATCH REPORT", "匹配报告", "结果绑定到本次分析的简历版本、岗位版本和规则版本；未知信息仍保持未知。", `<button class="button outline small" data-page="dashboard">回到工作台</button>`)}<section class="card"><div class="report-top"><div class="score-block" style="--score:${Math.max(0, Math.min(Number.isFinite(score) ? score : 0, 100))}"><div class="score-copy"><strong>${Number.isFinite(score) ? esc(number(score)) : "—"}</strong><span>能力综合分</span></div></div><div class="report-summary"><span class="tag ${statusClass(advice.status)}">${esc(labelStatus(advice.status))}</span><h3>${esc(advice.text || "报告已生成")}</h3><p>${esc((advice.next_steps || []).join(" ") || "请结合证据和条件对照做人工判断。")}</p><div class="report-metrics"><div class="metric-pill"><strong>${esc(percent(analysis.evidence_coverage ?? report.evidence_coverage))}</strong><span>证据覆盖率</span></div><div class="metric-pill"><strong>${esc(analysis.job_category || report.job_category || "general")}</strong><span>岗位类别</span></div><div class="metric-pill"><strong>${esc(analysis.scoring_rule_version || report.scoring_rule_version || "ability-v0.1")}</strong><span>评分规则</span></div></div><div class="item-actions">${pool && resumeId ? `<button class="button primary small" data-action="create-variant">制作岗位版简历</button><button class="button soft small" data-action="start-interview">开始面试练习</button>` : ""}</div></div></div><div class="report-grid"><div class="report-card"><h3>能力维度与逐条依据</h3>${(report.dimensions || []).map((item) => demoDimension(item)).join("") || `<div class="empty">暂无维度数据</div>`}</div><div class="report-card"><h3>岗位条件对照</h3><div style="margin-top:8px">${(report.conditions || []).map((item) => `<div class="condition-row"><strong>${esc({ job_title: "岗位方向", location: "地点", work_mode: "办公方式", salary: "薪资" }[item.condition] || item.condition)}</strong><span class="tag ${statusClass(item.status)}">${esc(labelStatus(item.status))}</span><p>${esc(item.explanation)}</p></div>`).join("") || `<div class="empty">没有条件数据</div>`}</div></div><div class="report-card full"><h3>输入版本与可追溯信息</h3><div class="version-strip">${(analysis.input_versions || []).filter(Boolean).map((item) => `<span class="version-chip">${esc(item.type)} · ${esc(item.id)}</span>`).join("")}<span class="version-chip">analysis · ${esc(analysis.id)}</span></div><details class="raw-report"><summary>展开完整报告 JSON</summary><pre>${esc(json(analysis))}</pre></details></div></div></section>`;
        }

        function findPoolForAnalysis(analysisId) {
          return state.workspace.data.pool.find((item) => item.latest_analysis?.id === analysisId) || null;
        }

        function variantsPage() {
          const variants = state.workspace.data.variants;
          const pools = state.workspace.data.pool.filter((item) => item.resume_version_id);
          return `${heading("RESUME VARIANTS", "岗位版简历", "从冻结简历版本生成岗位版成品；后续导出仍绑定同一个版本。", `<button class="button outline small" data-action="refresh">刷新</button>`)}<div class="content-grid"><section class="card"><div class="card-head"><div><h3>生成岗位版</h3><p>可以从刚打开的报告直接进入，也可以选择一个已分析岗位。</p></div></div><div class="card-body"><form id="variant-form" class="form-card"><div class="field-group"><label for="variant-pool">目标岗位</label><select id="variant-pool" class="select" name="pool_id" ${pools.length ? "" : "disabled"}>${pools.map((item) => `<option value="${esc(item.id)}">${esc(item.job_title)} · ${esc(item.id.slice(0, 8))}</option>`).join("") || `<option>请先在匹配池生成报告</option>`}</select></div><div class="field-group"><label for="variant-title">成品名称</label><input id="variant-title" class="field" name="title" value="${esc(state.workspace.selectedAnalysis ? "前端开发工程师 · 岗位版" : "岗位版简历")}" required /></div><div class="form-foot"><span class="micro">岗位版内容只来自已确认简历和真实改写结果。</span><button class="button primary small" type="submit" ${pools.length ? "" : "disabled"}>创建版本</button></div></form>${state.workspace.lastExport ? `<div class="callout success">PDF 已生成：${esc(state.workspace.lastExport.id)} · <a href="/api/v1/exports/${esc(state.workspace.lastExport.id)}/file" target="_blank" rel="noreferrer">下载岗位版简历</a></div>` : ""}</div></section><section class="card"><div class="card-head"><div><h3>已生成成品</h3><p>每个岗位版可以继续编辑和导出。</p></div></div><div class="card-body">${variants.length ? variants.map((item) => variantItem(item)).join("") : `<div class="empty"><div><strong>还没有岗位版简历</strong><p>从匹配报告点击“制作岗位版简历”，或在左侧选择岗位创建。</p></div></div>`}</div></section></div>`;
        }

        function variantItem(item) {
          const version = item.versions?.[0];
          const isLast = state.workspace.lastExport && version && state.workspace.lastExport.version_id === version.id;

        function usagePage() {
          const usage = state.workspace.data.usage || { balances: [], entries: [] };
