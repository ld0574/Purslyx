<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purslyx · 日志管理</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body data-page="admin-logs" data-role="admin">
    <!-- 日志管理页独立承载三类日志筛选、详情与私有导出。 -->
    <div id="app">
      <main class="route-bootstrap" data-route-view="admin-logs">
        <p class="eyebrow">ADMIN LOGS</p><h1>日志管理</h1><p>分别查询管理操作、登录安全和任务运行，不显示业务正文或凭据。</p>
        <div class="route-bootstrap-grid"><section><h2>日志筛选</h2><p>按日期、账号、结果、类型和关联 ID 查询。</p></section><section><h2>详情与导出</h2><p>导出冻结当前筛选，文件保持私有并留下审计记录。</p></section></div>
      </main>
    </div>
    <noscript>请启用 JavaScript 后查看日志。</noscript>
    <script src="/assets/workbench.js" defer></script>
  </body>
</html>
