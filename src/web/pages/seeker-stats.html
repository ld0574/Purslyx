<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purslyx · 统计与反馈</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body data-page="stats" data-role="seeker">
    <!-- 求职统计页独立展示去投递点击口径和产品反馈。 -->
    <div id="app">
      <main class="route-bootstrap" data-route-view="seeker-stats">
        <p class="eyebrow">MY STATS</p><h1>求职统计与反馈</h1><p>查看本人的去投递点击数；该数字不代表外部平台已成功投递。</p>
        <div class="route-bootstrap-grid"><section><h2>今日统计</h2><p>按上海自然日读取可追溯的点击记录。</p></section><section><h2>产品反馈</h2><p>反馈与投递点击分开保存和统计。</p></section></div>
      </main>
    </div>
    <noscript>请启用 JavaScript 后查看统计与反馈。</noscript>
    <script src="/assets/workbench.js" defer></script>
  </body>
</html>
