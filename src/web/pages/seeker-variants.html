<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purslyx · 岗位版简历</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body data-page="variants" data-role="seeker">
    <!-- 岗位版页面独立承载内容、排版、版本和 PDF 导出。 -->

      <main class="route-bootstrap" data-route-view="seeker-variants">
        <p class="eyebrow">RESUME VARIANTS</p><h1>岗位版简历</h1><p>基于冻结简历或已采用改写生成岗位版，预览与 PDF 使用同一版本。</p>
        <div class="route-bootstrap-grid"><section><h2>内容与模块</h2><p>编辑段落、调整模块顺序并保存新版本。</p></section><section><h2>排版与导出</h2><p>调整字体、字号、行距和加粗，生成可下载 PDF。</p></section></div>
      </main>
    </div>
    <noscript>请启用 JavaScript 后编辑岗位版简历。</noscript>
    <script src="/assets/workbench.js" defer></script>
  </body>
