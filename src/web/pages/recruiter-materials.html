<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purslyx · 候选人资料</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body data-page="resume" data-role="recruiter">
    <!-- 招聘资料页独立承载 JD、候选人简历和候选人明确期望。 -->
    <div id="app">
      <main class="route-bootstrap" data-route-view="recruiter-materials">
        <p class="eyebrow">CANDIDATE MATERIALS</p><h1>候选人资料</h1><p>分别确认岗位说明与候选人简历，只记录候选人明确披露的条件。</p>
        <div class="route-bootstrap-grid"><section><h2>资料导入</h2><p>上传或粘贴 JD 和候选人简历，确认冻结版本。</p></section><section><h2>单人分析</h2><p>选择两份版本与候选人条件，确认消耗后生成报告。</p></section></div>
      </main>
    </div>
    <noscript>请启用 JavaScript 后管理候选人资料。</noscript>
    <script src="/assets/workbench.js" defer></script>
  </body>
