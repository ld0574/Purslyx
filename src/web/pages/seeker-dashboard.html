<!doctype html>
<html lang="zh-CN">
  <head>

    <title>Purslyx · 求职工作台</title>

      <main class="route-bootstrap" data-route-view="seeker-dashboard">

      </main>

    <script src="/assets/workbench.js" defer></script>
