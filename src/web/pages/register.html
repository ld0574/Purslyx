<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purslyx · 注册</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body data-page="register" data-auth-mode="register">
    <!-- 注册页明确呈现固定身份选择和邮箱认证入口。 -->
    <div id="app">
      <main class="route-bootstrap" data-route-view="register">
        <p class="eyebrow">ACCOUNT</p><h1>创建 Purslyx 账号</h1><p>选择求职或招聘身份；首版身份固定，另一身份使用另一邮箱。</p>
        <div class="route-bootstrap-grid"><section><h2>求职身份</h2><p>使用简历、匹配池、改写、岗位版与面试练习。</p></section><section><h2>招聘身份</h2><p>导入岗位和候选人资料，完成单人证据分析。</p></section></div>
      </main>
    </div>
    <noscript>请启用 JavaScript 后注册 Purslyx。</noscript>
    <script src="/assets/workbench.js" defer></script>
  </body>
</html>
