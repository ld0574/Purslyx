<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purslyx · 匹配报告</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body data-page="report" data-role="seeker">
    <!-- 报告页独立读取 analysis_id，并恢复对应的冻结输入和证据。 -->

      <main class="route-bootstrap" data-route-view="seeker-report">
        <p class="eyebrow">EVIDENCE REPORT</p><h1>岗位匹配报告</h1><p>逐条核对能力维度、岗位条件、原文证据和待核实事项。</p>
        <div class="route-bootstrap-grid"><section><h2>能力与条件</h2><p>服务端固定规则计算，页面不自行重算。</p></section><section><h2>下一步</h2><p>进入事实改写、岗位版简历或面试练习。</p></section></div>
      </main>
    </div>
    <noscript>请启用 JavaScript 后查看匹配报告。</noscript>
    <script src="/assets/workbench.js" defer></script>
  </body>
