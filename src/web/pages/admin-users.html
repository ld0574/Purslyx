<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purslyx · 用户管理</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body data-page="admin-users" data-role="admin">
    <!-- 用户管理页独立承载搜索、账号详情、状态与后台角色分配。 -->
    <div id="app">
      <main class="route-bootstrap" data-route-view="admin-users">
        <p class="eyebrow">ADMIN USERS</p><h1>用户管理</h1><p>按邮箱、固定注册身份和状态搜索账号，不读取私有简历正文。</p>
        <div class="route-bootstrap-grid"><section><h2>账号列表</h2><p>查看注册、验证、状态和最近登录概要。</p></section><section><h2>账号详情</h2><p>在权限范围内维护状态和后台角色。</p></section></div>
      </main>
    </div>
    <noscript>请启用 JavaScript 后管理账号。</noscript>
    <script src="/assets/workbench.js" defer></script>
  </body>
</html>
