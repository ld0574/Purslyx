# Purslyx OpenResty reverse-proxy configuration.
# The rolling-release script writes purslyx-upstream.conf with the active slot port.

# 登录状态按浏览器 origin 隔离；统一 www 到主域，避免同一个账号在两个域名各保存一份会话。
server {
    listen 80;
    listen [::]:80;
    server_name www.purslyx.com;

    return 301 https://purslyx.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.purslyx.com;

    ssl_certificate /etc/letsencrypt/live/purslyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purslyx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://purslyx.com$request_uri;
}

# HTTP 统一跳转 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name purslyx.com *.purslyx.com;

    return 301 https://$host$request_uri;
}

# 根域名和一级泛域名共用同一张证书。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name purslyx.com *.purslyx.com;

    # Cloudflare 代理到源站时，$remote_addr 默认是 Cloudflare 节点地址。
    # 仅信任 Cloudflare 官方网段中的 CF-Connecting-IP，避免直接访问源站时
    # 任意客户端伪造真实 IP；启用 realip 后，应用拿到的 request.client.host
    # 和 OpenResty access log 都会是最终访客地址。
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    ssl_certificate /etc/letsencrypt/live/purslyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purslyx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 简历、岗位文件和 PDF 导出可能超过默认请求体大小。
    client_max_body_size 30m;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://purslyx_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;

        proxy_redirect off;
    }
}
