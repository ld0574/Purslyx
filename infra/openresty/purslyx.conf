# Purslyx OpenResty reverse-proxy configuration.
# The rolling-release script writes purslyx-upstream.conf with the active slot port.

# HTTP 统一跳转 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name purslyx.com *.purslyx.com;

    return 301 https://$host$request_uri;
}

# 根域名和一级泛域名共用同一张证书。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name purslyx.com *.purslyx.com;

    ssl_certificate /etc/letsencrypt/live/purslyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purslyx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 简历、岗位文件和 PDF 导出可能超过默认请求体大小。
    client_max_body_size 30m;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://purslyx_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;

        proxy_redirect off;
    }
}
