    if(state.modal==='capture')return `<div class="modal-backdrop"><section class="modal"><div class="modal-head"><div><h2>确认岗位并加入匹配池</h2><p>浏览器已自动获取当前岗位；你也可以在这里手动粘贴。</p></div><button class="icon-button" data-modal-close>${icon('close')}</button></div><div class="modal-body"><div class="card" style="box-shadow:none"><div class="card-head"><div><h3>Purslyx 浏览器侧</h3><p>BOSS 直聘当前岗位 · 虚构示例</p></div><span class="tag success right">获取完成</span></div><div class="card-body"><h3 style="margin-top:0">中高级前端工程师</h3><p class="muted micro">云杉科技 · 杭州 · 20–30K</p><div class="attention-note"><strong>有 1 个字段待检查</strong><p>办公方式来自页面标签，请确认是否为混合办公。</p></div></div></div><div class="field-group" style="margin-top:12px"><label>本岗位使用的求职期望</label><select class="field"><option>前端工程师 · 杭州／远程 · 20–30K</option><option>后端工程师 · 杭州现场 · 30–40K</option></select></div><div class="notice" style="margin-top:12px">${icon('usage')}确认入池后才会使用这条期望生成快照；保存并分析消耗 1 次分析机会，只保存岗位不会扣除次数。</div></div><div class="modal-actions"><button class="button" data-modal-close>只保存岗位</button><button class="button primary" data-action="save-job">保存并分析</button></div></section></div>`;
    if(state.modal==='expectation')return `<div class="modal-backdrop"><section class="modal"><div class="modal-head"><div><h2>新增岗位期望</h2><p>岗位、地点、办公方式和薪资会作为同一组条件保存。</p></div><button class="icon-button" data-modal-close>${icon('close')}</button></div><div class="modal-body"><div class="feedback-form"><div class="field-group"><label>期望岗位</label><input class="field" value="后端工程师"></div><div class="info-grid"><div class="field-group"><label>期望地点</label><input class="field" value="杭州"></div><div class="field-group"><label>办公方式</label><select class="field"><option>现场办公</option><option>混合办公</option><option>远程</option></select></div><div class="field-group"><label>税前月薪下限</label><input class="field" value="30K"></div><div class="field-group"><label>税前月薪上限</label><input class="field" value="40K"></div></div><div class="field-group"><label>条件强度</label><select class="field"><option>岗位方向可协商，地点必须符合</option><option>全部可协商</option></select></div></div><div class="attention-note"><strong>未填写不等于不限</strong><p>不确定的字段会保存为“未知”，不会自动复制另一条期望。</p></div></div><div class="modal-actions"><button class="button" data-modal-close>取消</button><button class="button primary" data-action="save-expectation">保存这条期望</button></div></section></div>`;
    if(state.modal==='log')return `<div class="modal-backdrop"><section class="modal"><div class="modal-head"><div><h2>管理操作详情</h2><p>关联 ID req_91K4 · 今天 16:42:18</p></div><button class="icon-button" data-modal-close>${icon('close')}</button></div><div class="modal-body"><div class="info-grid"><div class="info-item"><label>操作者</label><strong>示例管理员</strong></div><div class="info-item"><label>结果</label><strong>成功</strong></div><div class="info-item"><label>操作</label><strong>追加分析次数</strong></div><div class="info-item"><label>目标账号</label><strong>林舟 · 求职</strong></div><div class="info-item"><label>变更前</label><strong>14 次</strong></div><div class="info-item"><label>变更后</label><strong>19 次</strong></div></div><div class="notice" style="margin-top:14px">${icon('shield')}原因：内测问题补偿。日志保存必要的操作摘要和前后值，不包含该用户的简历或岗位正文。</div></div><div class="modal-actions"><button class="button primary" data-modal-close>关闭</button></div></section></div>`;
    return '';
  }
  function renderOverlay(){const o=$('#overlay');o.innerHTML=(state.modal?modalContent():'')+(state.toast?`<div class="toast">${icon('check')} ${state.toast}</div>`:'')}
  function render(){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===state.role));document.querySelectorAll('[data-demo-state]').forEach(b=>b.classList.toggle('active',b.dataset.demoState===state.demoState));$('#prototype').innerHTML=state.role==='public'?authPage():shell();if(preset==='editor'){document.querySelector('.workflow')?.remove();document.querySelector('.rewrite-workspace')?.remove();const builder=document.querySelector('.builder');if(builder)builder.style.marginTop='0'}renderOverlay()}
  document.addEventListener('click',e=>{
    const role=e.target.closest('[data-role]');if(role){state.role=role.dataset.role;state.demoState='complete';state.resumeTab='overview';state.poolView='summary';state.page=state.role==='admin'?'overview':'dashboard';render();return}
    const ds=e.target.closest('[data-demo-state]');if(ds){state.demoState=ds.dataset.demoState;render();return}
    const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;render();return}
    const tab=e.target.closest('[data-resume-tab]');if(tab){state.page='resume';state.resumeTab=tab.dataset.resumeTab;render();return}
    const auth=e.target.closest('[data-auth-tab]');if(auth){state.authTab=auth.dataset.authTab;render();return}
    const identity=e.target.closest('[data-identity]');if(identity){state.identity=identity.dataset.identity;render();return}
    const job=e.target.closest('[data-job]');if(job){state.selectedJob=Number(job.dataset.job);state.poolView='summary';render();return}
    const poolView=e.target.closest('[data-pool-view]');if(poolView){state.poolView=poolView.dataset.poolView;render();return}
    const logTab=e.target.closest('[data-log-tab]');if(logTab){state.logTab=logTab.dataset.logTab;render();return}
    const user=e.target.closest('[data-user]');if(user){state.selectedUser=Number(user.dataset.user);render();return}
    const openJob=e.target.closest('[data-open-job]');if(openJob){state.selectedJob=Number(openJob.dataset.openJob);state.poolView='summary';state.page='pool';render();return}
    const modal=e.target.closest('[data-modal]');if(modal){state.modal=modal.dataset.modal;renderOverlay();return}
    if(e.target.closest('[data-modal-close]')){state.modal='';renderOverlay();return}
    const action=e.target.closest('[data-action]')?.dataset.action;
    if(action==='state-reset'){state.demoState='complete';render()}
    if(action==='auth-submit'){state.role=state.identity;state.page='dashboard';showToast(state.authTab==='register'?'演示：验证完成，已进入工作台':'演示：已登录');render()}
    if(action==='answer'){state.interviewAnswered=true;render();showToast('回答已保存，本场不会重复扣次')}
    if(action==='adopt'){state.rewriteAdopted=true;render();showToast('已采用到当前岗位版；继续编辑会撤回采用状态')}
    if(action==='keep-original'){state.rewriteAdopted=false;render();showToast('已保留原文，建议仍可稍后采用')}
    if(action==='save-fact'){showToast('补充事实已保存，并保留本人确认来源')}
    if(action==='move-module'){showToast('模块顺序已更新，预览正在重新排版')}
    if(action==='save-permissions'){showToast('权限组合已保存，前后值已写入操作日志')}
    if(action==='view-log'){state.modal='log';renderOverlay()}
    if(action==='save-expectation'){state.modal='';renderOverlay();showToast('岗位期望已保存为独立条件组合')}
    if(action==='export'){showToast('产品稿演示：PDF 导出任务已创建')}
    if(action==='feedback'){showToast('感谢反馈，已单独记录')}
    if(action==='save-role'){showToast('后台角色已更新，操作记录已保存')}
    if(action==='grant'){showToast('已追加 5 次分析机会，发放记录已保存')}
    if(action==='confirm-apply'){state.modal='';renderOverlay();showToast('已记录去投递点击；产品稿不会打开外部平台')}
    if(action==='start-import'){state.modal='';renderOverlay();showToast('文件已进入整理任务，可稍后返回查看')}
    if(action==='save-job'){state.modal='';renderOverlay();showToast('岗位已入池，分析任务已开始')}
  });
  document.addEventListener('input',e=>{if(e.target.id==='rewrite-text'){state.rewriteText=e.target.value;if(state.rewriteAdopted){state.rewriteAdopted=false;const badge=$('#adopt-state');if(badge){badge.className='tag opportunity';badge.textContent='内容已修改，需重新确认'}}}});
  const preset=new URLSearchParams(location.search).get('view');if(preset==='expectations'){state.role='seeker';state.page='resume';state.resumeTab='expectations'}if(preset==='rewrite'||preset==='editor'){state.role='seeker';state.page='resume';state.resumeTab='rewrite'}if(preset==='pool-report'){state.role='seeker';state.page='pool';state.poolView='report'}if(preset==='admin-logs'){state.role='admin';state.page='logs'}if(preset==='admin-roles'){state.role='admin';state.page='roles'}
  render();
})();
</script>
</body>
</html>
